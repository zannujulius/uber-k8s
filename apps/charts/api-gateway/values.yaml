apiGateway:
  releaseName: api-gateway
  imageRegistry:
    ghcr: "ghcr.io"
  replicaCount: 2
  image:
    name: api-gateway
    repository: api-gateway
    github:
      owner: zannujulius
    tag: 92ff8054724909c7699131240db979314bb1a927
    pullPolicy: IfNotPresent
    port: 3000
    env:
      NODE_ENV: development
  jwt:
    JWT_SECRET: "" # it is read from the sealed secret yml
    JWT_EXPIRES_IN: 7d
    JWT_REFRESH_SECRET: "" # it is read from the sealed secret yml
    JWT_REFRESH_EXPIRES_IN: 30d
  rate_limit:
    RATE_LIMIT_WINDOW_MS: 900000
    RATE_LIMIT_MAX: 100
  cors:
    CORS_ORIGINS: http://localhost:5173
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  services:
    RIDER_SERVICE_URL: http://localhost:3001
    DRIVER_SERVICE_URL: http://localhost:3002
    LOCATION_SERVICE_URL: http://localhost:3003
    DRIVER_ASSIGNMENT_SERVICE_URL: http://localhost:3004
    RIDER_WS_URL: ws://rider-websocket-server-service.uber-ns-app.svc.cluster.local:3010
    DRIVER_WS_URL: ws://localhost:3011
